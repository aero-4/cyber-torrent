<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Register - CSRF Vulnerable App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Небольшие дополнения для улучшения читаемости */
        body {
            background-color: #09090b; /* zinc-950 */
        }
        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            transition: background-color 0s 600000s, color 0s 600000s;
        }
    </style>
</head>
<body class="bg-zinc-950 antialiased">
    <div class="min-h-screen bg-zinc-950 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <!-- Блок для flash-сообщений (в статическом HTML скрыт, но структура сохранена) -->
            <!--
            {% if message %}
            <div class="mb-4 rounded-2xl border border-emerald-500/30 bg-zinc-900 px-4 py-3 text-center text-sm font-semibold {{ message_class }}">
              {{ message }}
            </div>
            {% endif %}
            -->

            <div id="globalMessage" class="mb-4 text-center text-sm font-semibold"></div>

            <div class="rounded-2xl border border-emerald-500/30 bg-black p-8 shadow-2xl shadow-emerald-500/20">
                <h1 class="mb-2 text-3xl font-bold text-emerald-400">Register</h1>
                <p class="mb-6 text-sm text-zinc-400">Создайте аккаунт и подключите OTP</p>

                <form id="registerForm" method="post" action="#" class="space-y-5">
                    <!-- В реальном приложении CSRF-токен подставляется сервером -->
                    <input type="hidden" name="token_key" id="token_key" value="example_csrf_token_12345">

                    <div>
                        <label for="email" class="mb-1 block text-sm font-semibold text-emerald-400">Email</label>
                        <input type="email" name="email" id="email" required
                               class="w-full rounded-xl border border-emerald-500/40 bg-zinc-900 px-4 py-3 text-white placeholder:text-zinc-500 outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition"
                               placeholder="name@example.com">
                    </div>

                    <div>
                        <label for="password" class="mb-1 block text-sm font-semibold text-emerald-400">Password</label>
                        <input type="password" name="password" id="password" required
                               class="w-full rounded-xl border border-emerald-500/40 bg-zinc-900 px-4 py-3 text-white placeholder:text-zinc-500 outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition"
                               placeholder="••••••••">
                    </div>

                    <button type="submit"
                            class="w-full rounded-xl bg-emerald-600 py-3 text-lg font-bold text-white shadow-lg shadow-emerald-600/20 transition hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        Регистрация
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <a href="/auth/login" class="text-sm font-semibold text-emerald-400 hover:text-emerald-300 transition">
                        Нет аккаунта? Войти
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Простой скрипт для демонстрации работы globalMessage (можно убрать)
        const form = document.getElementById('registerForm');
        const globalMsgDiv = document.getElementById('globalMessage');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                globalMsgDiv.textContent = 'Заполните все поля';
                globalMsgDiv.className = 'mb-4 text-center text-sm font-semibold text-red-400';
                return;
            }

            // Имитация успешной отправки
            globalMsgDiv.textContent = 'Регистрация выполнена (демо)';
            globalMsgDiv.className = 'mb-4 text-center text-sm font-semibold text-emerald-400';
            setTimeout(() => {
                globalMsgDiv.textContent = '';
            }, 3000);
        });
    </script>
</body>
</html>
