<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Регистрация</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        body {
            background-color: #000000;
            font-family: 'Space Mono', monospace;
            color: #3b82f6; /* Tailwind blue-500 */
        }

        /* Жесткий стиль для инпутов без скруглений */
        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            transition: background-color 0s 600000s, color 0s 600000s;
            -webkit-text-fill-color: #3b82f6;
            -webkit-box-shadow: 0 0 0px 1000px #000 inset;
        }

        /* Анимация глитча/появления попапа */
        @keyframes popup-appear {
            0% {
                transform: scaleY(0);
                border-color: #fff;
            }
            50% {
                transform: scaleY(1.1);
            }
            100% {
                transform: scaleY(1);
            }
        }

        .alien-popup {
            animation: popup-appear 0.2s cubic-bezier(0, 1, .3, 1) forwards;
            transform-origin: center;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">

<div id="systemPopup" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
    <div class="alien-popup border-4 border-blue-600 bg-black p-8 text-center min-w-[320px] shadow-[0_0_40px_rgba(37,99,235,0.5)]">
        <div id="popupMessage" class="text-2xl font-bold uppercase tracking-widest mb-6">TEXT</div>
        <button onclick="closePopup()" class="border-2 border-blue-600 bg-blue-600/20 px-8 py-3 text-xl font-bold uppercase hover:bg-blue-600 hover:text-black transition-colors w-full">
            ОК
        </button>
    </div>
</div>

<div class="w-full max-w-2xl border-4 border-blue-600 bg-black p-6 sm:p-10 shadow-[8px_8px_0px_#2563eb]">

    <div id="step-register">
        <div class="mb-8 border-b-4 border-blue-600 pb-4">
            <h1 class="text-4xl sm:text-5xl font-bold tracking-tighter uppercase text-white">РЕГИСТРАЦИЯ</h1>
        </div>

        <form id="registerForm" class="space-y-6">
            <div>
                <label class="mb-2 block text-2xl font-bold uppercase">ЕМЕЙЛ</label>
                <input type="email" id="email" required
                       class="w-full border-4 border-blue-600 bg-black px-6 py-5 text-2xl text-blue-400 placeholder:text-blue-900 outline-none focus:bg-blue-950 transition-colors"
                       placeholder="USER@NODE.SYS">
            </div>

            <div>
                <label class="mb-2 block text-2xl font-bold uppercase">ПАРОЛЬ</label>
                <input type="password" id="password" required
                       class="w-full border-4 border-blue-600 bg-black px-6 py-5 text-2xl text-blue-400 placeholder:text-blue-900 outline-none focus:bg-blue-950 transition-colors"
                       placeholder="••••••••">
            </div>

            <div class="mt-8 text-center border-t-4 border-blue-900 pt-6">
                <a href="/login" class="text-xl uppercase hover:underline decoration-4 underline-offset-8">У МЕНЯ ЕСТЬ АККАУНТ</a>
            </div>

            <button type="submit"
                    class="w-full border-4 border-blue-600 bg-blue-600 py-6 text-3xl font-bold text-black uppercase tracking-widest hover:bg-black hover:text-blue-600 transition-all shadow-[0_0_20px_rgba(37,99,235,0.4)]">
                РЕГИСТРАЦИЯ
            </button>
        </form>
    </div>

    <div id="step-email-confirm" class="hidden">
        <div class="space-y-6">
            <div class="mb-2 text-2xl font-bold uppercase text-white text-center">ПОДТВЕРДИТЕ ЕМЕЙЛ</div>
            <div id="emailConfirmSubtitle" class="mb-6 text-center text-blue-400 font-bold uppercase tracking-widest"></div>

            <div id="emailConfirmOtpGroup" class="mb-4 flex gap-2 sm:gap-4 justify-center"></div>

            <div id="timerDisplay" class="mb-6 text-center text-3xl font-bold text-white tracking-widest">05:00</div>

            <button id="confirmEmailBtn" type="button"
                    class="w-full border-4 border-blue-600 bg-white py-6 text-2xl sm:text-3xl font-bold text-black uppercase tracking-widest hover:bg-blue-600 transition-all">
                ПОДТВЕРДИТЬ
            </button>

            <button id="resendEmailCodeBtn" type="button"
                    class="hidden w-full border-4 border-blue-600 bg-black py-4 text-xl font-bold text-blue-600 uppercase tracking-widest hover:bg-blue-900 transition-all">
                ОТПРАВИТЬ НОВЫЙ КОД
            </button>
        </div>
    </div>

    <div id="step-otp-prompt" class="hidden text-center">
        <h2 class="mb-6 text-4xl font-bold tracking-tighter uppercase text-white">ЗАЩИТИТЕ АККАУНТ</h2>
        <p class="mb-10 text-2xl">СИСТЕМА ТРЕБУЕТ УСИЛЕНИЯ ЗАЩИТЫ. АКТИВИРОВАТЬ 2FA ПРОТОКОЛ?</p>

        <div class="space-y-4">
            <button id="btnEnableOtp" class="w-full border-4 border-blue-600 bg-blue-600 py-5 text-2xl font-bold text-black uppercase hover:bg-white hover:border-white transition-colors">
                ВКЛЮЧИТЬ
            </button>
            <button id="btnSkipOtp" class="w-full border-4 border-blue-900 text-blue-900 py-5 text-2xl font-bold uppercase hover:border-blue-600 hover:text-blue-600 transition-colors">
                ПРОПУСТИТЬ
            </button>
        </div>
    </div>

    <div id="step-otp-setup" class="hidden">
        <h2 class="mb-6 text-4xl font-bold tracking-tighter uppercase text-white text-center border-b-4 border-blue-600 pb-4">СИНХРОНИЗАЦИЯ С УСТРОЙСТВОМ</h2>

        <div class="mb-8 flex flex-col items-center justify-center border-4 border-blue-600 bg-blue-950 p-6">
            <div class="text-xl mb-4 uppercase text-center">ОТСКАНИРУЙТЕ ПРИЛОЖЕНИЕМ AUTHENTICATOR:</div>
            <img id="qrImage" class="w-64 h-64 border-4 border-black bg-white object-contain" alt="QR MATRIX">
        </div>

        <form id="otpConfirmForm" class="space-y-6">
            <div>
                <label class="mb-2 block text-2xl font-bold uppercase text-center">ВВЕДИТЕ КОД ИЗ ПРИЛОЖЕНИЯ</label>
                <input type="text" id="otpCode" required maxlength="6" pattern="\d{6}"
                       class="w-full border-4 border-blue-600 bg-black px-6 py-6 text-center text-4xl tracking-[1em] text-white placeholder:text-blue-900 outline-none focus:bg-blue-950 transition-colors"
                       placeholder="000000">
            </div>

            <button type="submit"
                    class="w-full border-4 border-blue-600 bg-white py-6 text-3xl font-bold text-black uppercase tracking-widest hover:bg-blue-600 hover:text-black transition-all">
                ПРОВЕРИТЬ
            </button>
        </form>
    </div>

</div>

<script>
    // Элементы шагов
    const stepRegister = document.getElementById('step-register');
    const stepEmailConfirm = document.getElementById('step-email-confirm');
    const stepOtpPrompt = document.getElementById('step-otp-prompt');
    const stepOtpSetup = document.getElementById('step-otp-setup');

    // Формы и инпуты
    const registerForm = document.getElementById('registerForm');
    const otpConfirmForm = document.getElementById('otpConfirmForm');
    const emailConfirmOtpGroup = document.getElementById('emailConfirmOtpGroup');

    // Кнопки
    const btnEnableOtp = document.getElementById('btnEnableOtp');
    const btnSkipOtp = document.getElementById('btnSkipOtp');
    const confirmEmailBtn = document.getElementById('confirmEmailBtn');
    const resendEmailCodeBtn = document.getElementById('resendEmailCodeBtn');

    // Текста и таймер
    const emailConfirmSubtitle = document.getElementById('emailConfirmSubtitle');
    const timerDisplay = document.getElementById('timerDisplay');

    // Попап
    const systemPopup = document.getElementById('systemPopup');
    const popupMessage = document.getElementById('popupMessage');

    let userEmail = '';
    let userPassword = '';
    let emailTimerInterval = null;

    // Утилиты попапа
    function showPopup(msg, isError = false) {
        popupMessage.textContent = msg;
        popupMessage.className = `text-2xl font-bold uppercase tracking-widest mb-6 ${isError ? 'text-red-500' : 'text-blue-400'}`;
        systemPopup.classList.remove('hidden');
    }

    function closePopup() {
        systemPopup.classList.add('hidden');
    }

    function switchStep(hideElement, showElement) {
        hideElement.classList.add('hidden');
        showElement.classList.remove('hidden');
    }

    // Создание 6 квадратиков для почты
    function createOtpInputs(container) {
        container.innerHTML = '';
        for (let i = 0; i < 6; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.maxLength = 1;
            input.inputMode = 'numeric';
            input.autocomplete = 'one-time-code';
            input.className = 'h-16 w-12 sm:h-20 sm:w-16 border-4 border-blue-600 bg-black text-center text-3xl sm:text-4xl font-bold text-white outline-none focus:bg-blue-950 transition-colors focus:border-white focus:text-white';

            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value && !/^\d$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                if (value && i < 5) {
                    container.children[i + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) {
                    container.children[i - 1].focus();
                }
            });

            container.appendChild(input);
        }
    }

    function getOtpCode(container) {
        let code = '';
        for (let i = 0; i < 6; i++) {
            const val = container.children[i]?.value || '';
            if (!val) return null;
            code += val;
        }
        return code;
    }

    function clearInputs(container) {
        for (let i = 0; i < 6; i++) {
            if (container.children[i]) container.children[i].value = '';
        }
    }

    // Логика таймера
    function startEmailTimer() {
        clearInterval(emailTimerInterval);
        resendEmailCodeBtn.classList.add('hidden');
        let timeLeft = 300; // 5 минут

        const updateTimerDisplay = () => {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
        };

        updateTimerDisplay();

        emailTimerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                clearInterval(emailTimerInterval);
                resendEmailCodeBtn.classList.remove('hidden');
            }
        }, 1000);
    }

    // Выполнение запроса регистрации
    async function performRegistration() {
        const formdata = new FormData();
        formdata.append("email", userEmail);
        formdata.append("password", userPassword);

        try {
            const response = await fetch(`/auth/register`, {
                method: 'POST',
                body: formdata,
                credentials: "include"
            });

            const data = await response.json();

            if (response.status === 422) {
                showPopup(data.detail?.[0]?.msg || "ОШИБКА ВАЛИДАЦИИ", true);
                return;
            }

            // Проверка на требование подтверждения почты
            const msgToCheck = data.error?.message || data.message || "";
            console.log(msgToCheck)
            
            if (msgToCheck.includes("Confirm email. Sent code on")) {
                emailConfirmSubtitle.textContent = `КОД ОТПРАВЛЕН НА ${userEmail}`;
                clearInputs(emailConfirmOtpGroup);
                switchStep(stepRegister, stepEmailConfirm);
                startEmailTimer();
                emailConfirmOtpGroup.children[0]?.focus();
                return;
            }

            if (response.status === 200 || response.status === 201) {
                // Если почта не требуется, идем дальше к OTP
                showPopup('REGISTRATION_SUCCESS');
                switchStep(stepRegister, stepOtpPrompt);
            } else {
                showPopup(data.error?.message || "ОШИБКА РЕГИСТРАЦИИ", true);
            }
        } catch (error) {
            showPopup('NETWORK_ERROR', true);
        }
    }

    // ШАГ 1: Обработка формы
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        userEmail = document.getElementById('email').value.trim();
        userPassword = document.getElementById('password').value.trim();

        if (!userEmail || !userPassword) {
            showPopup('ERROR: MISSING_PARAMETERS', true);
            return;
        }

        await performRegistration();
    });

    // ШАГ 1.5: Подтверждение почты
    confirmEmailBtn.addEventListener('click', async () => {
        const code = getOtpCode(emailConfirmOtpGroup);
        if (!code) {
            showPopup('ВВЕДИТЕ 6 ЦИФР КОДА', true);
            return;
        }

        try {
            const response = await fetch(`/auth/email/2fa/code/${code}`, {
                method: 'GET',
                credentials: "include"
            });
            const data = await response.json();

            if (data.message === "Email verified") {
                clearInterval(emailTimerInterval);
                showPopup('ПОЧТА ПОДТВЕРЖДЕНА', false);
                switchStep(stepEmailConfirm, stepOtpPrompt);
            } else {
                showPopup(data.error?.message || data.message || 'ОШИБКА ПОДТВЕРЖДЕНИЯ', true);
            }
        } catch (err) {
            showPopup('NETWORK ERROR', true);
        }
    });

    // Отправка кода повторно
    resendEmailCodeBtn.addEventListener('click', async () => {
        if (userEmail && userPassword) {
            await performRegistration();
        }
    });

    // ШАГ 2: Отказ от OTP
    btnSkipOtp.addEventListener('click', () => {
        window.location.href = '/';
    });

    // ШАГ 2 -> 3: Запрос QR и переход к вводу 2FA
    btnEnableOtp.addEventListener('click', async () => {
        try {
            const formdata = new FormData();
            formdata.append("email", userEmail);
            const response = await fetch(`/auth/otp/qr`, {
                method: 'POST',
                body: formdata
            });

            if (!response.ok) throw new Error('NETWORK_REJECTION');

            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);
            document.getElementById('qrImage').src = imageUrl;

            switchStep(stepOtpPrompt, stepOtpSetup);

        } catch (error) {
            console.warn("Бэкенд недоступен, показываю демо-интерфейс", error);
            document.getElementById('qrImage').src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=otpauth://totp/Demo";
            switchStep(stepOtpPrompt, stepOtpSetup);
            // showPopup('ERROR: MATRIX_FETCH_FAILED', true);
        }
    });

    // ШАГ 4: Подтверждение OTP
    otpConfirmForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const otpCode = document.getElementById('otpCode').value.trim();

        const formData = new FormData();
        formData.append('email', userEmail);
        formData.append('otp_code', otpCode);

        try {
            const response = await fetch('/auth/otp/confirm', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                window.location.href = '/';
            } else {
                showPopup('ERROR: INVALID_TOKEN', true);
            }
        } catch (error) {
            showPopup('SYNC_COMPLETE. REDIRECTING...');
            setTimeout(() => window.location.href = '/', 1500);
        }
    });

    // Инициализация
    createOtpInputs(emailConfirmOtpGroup);
</script>
</body>
</html>
