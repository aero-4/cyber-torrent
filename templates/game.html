{% extends "base.html" %}

{% block content %}
<div id="game-content" class="min-h-screen text-gray-200">
    <div class="flex items-center justify-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>
</div>

<div id="lightbox-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-sm items-center justify-center opacity-0 transition-opacity duration-300">
    <button onclick="closeLightbox()" class="border-0 bg-transparent absolute top-5 right-5 text-white/50 hover:text-white z-50 transition-colors">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>

    <button onclick="changeLightboxImage(-1)" class="border-0 bg-transparent absolute left-0 top-0 bottom-0 w-20 md:w-32 flex items-center justify-center text-white/20 hover:text-white/80 hover:bg-white/5 transition-all z-40">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
    </button>

    <img id="lightbox-image" src="" class="bg-transparent max-h-[90vh] max-w-[90vw] object-contain rounded-lg shadow-2xl transition-transform duration-300" alt="Screenshot Full">

    <button onclick="changeLightboxImage(1)" class="border-0 bg-transparent absolute right-0 top-0 bottom-0 w-20 md:w-32 flex items-center justify-center text-white/20 hover:text-white/80 hover:bg-white/5 transition-all z-40">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
    </button>
</div>

<script>
    // Глобальные переменные для галереи
    let currentImageIndex = 0;
    let gameImages = [];

    // Функции управления лайтбоксом
    window.openLightbox = (index) => {
        currentImageIndex = index;
        const modal = document.getElementById('lightbox-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        // Небольшая задержка для плавной анимации opacity
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
        updateLightboxImage();
    };

    window.closeLightbox = () => {
        const modal = document.getElementById('lightbox-modal');
        modal.classList.add('opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }, 300); // ждем окончания анимации
    };

    window.changeLightboxImage = (step) => {
        currentImageIndex += step;
        if (currentImageIndex < 0) currentImageIndex = gameImages.length - 1;
        if (currentImageIndex >= gameImages.length) currentImageIndex = 0;
        updateLightboxImage();
    };

    const updateLightboxImage = () => {
        const imgEl = document.getElementById('lightbox-image');
        imgEl.src = gameImages[currentImageIndex].image;
    };

    // Функция прокрутки карусели похожих игр
    window.scrollSimilar = (direction) => {
        const carousel = document.getElementById('similar-carousel');
        if (carousel) {
            // Прокручиваем на ширину одной карточки + отступ (примерно 220px)
            carousel.scrollBy({left: direction * 220, behavior: 'smooth'});
        }
    };

    // Управление галереей с клавиатуры
    document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('lightbox-modal');
        if (!modal.classList.contains('hidden')) {
            if (e.key === 'Escape') window.closeLightbox();
            if (e.key === 'ArrowLeft') window.changeLightboxImage(-1);
            if (e.key === 'ArrowRight') window.changeLightboxImage(1);
        }
    });

    document.addEventListener("DOMContentLoaded", async () => {
        const content = document.getElementById("game-content");
        const pathParts = window.location.pathname.split('/');
        const slug = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];

        let game = null;
        let currentPage = 1;
        const LIMIT = 20;

        try {
            const response = await fetch(`/games/${slug}`);
            if (!response.ok) throw new Error("Игра не найдена");
            game = await response.json();

            // Сохраняем скриншоты глобально для лайтбокса
            if (game.game_images) {
                gameImages = game.game_images;
            }
        } catch (e) {
            content.innerHTML = "<h1 class='text-center py-10 text-xl font-bold'>Игра не найдена</h1>";
            return;
        }

        const cacheKey = `comments_cache_${game.id}`;

        const maskUser = (user) => {
            if (user && user.includes('@')) {
                const [name, domain] = user.split('@');
                return name.slice(0, Math.floor(name.length / 2)) + '***@' + domain;
            }
            return user || 'Аноним';
        };

        const formatDate = (dateString) => {
            if (!dateString)
                return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric'});
        };

        content.innerHTML = `
            <div class="relative h-[400px] w-full">
                <img src="${game.background_image || ''}" class="w-full h-full object-cover opacity-30 absolute inset-0" alt="Cover">
                <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/60 to-transparent"></div>
                <div class="relative mx-auto px-4 h-full flex flex-col justify-end pb-10">
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase">${game.platform || 'PC'}</span>
                        ${game.tags.slice(0, 5).map((tag) => `
                            <a href="/?tag=${encodeURIComponent(tag.name)}" class="bg-zinc-800 text-gray-300 text-xs px-3 py-1 rounded-full hover:bg-blue-600 hover:text-white transition-colors">
                                ${tag.name || "Без жанра"}
                            </a>
                        `).join('')}

                    </div>
                    <h1 class="text-4xl md:text-6xl font-black text-white mb-2">${game.name}</h1>
                    <p class="text-gray-400">Релиз: ${formatDate(game.release_date) || 'Неизвестно'}</p>
                </div>
            </div>

            <div class="mx-auto px-4 py-10">
                <div class="prose prose-invert max-w-none mb-12">
                    <h2 class="text-xl font-bold mb-4 border-l-4 border-gray-500 pl-3">Об игре</h2>
                    <p class="text-gray-400 leading-relaxed whitespace-pre-wrap">${game.description_raw || 'Описание отсутствует.'}</p>
                </div>

                <div id="screenshots-section" class="mb-16"></div>

                <div id="torrent-section" class="mb-16"></div>

                <div id="similar-games-section" class="mb-16"></div>

                <div class="border-t border-zinc-800 pt-10">
                    <h2 class="text-xl font-bold mb-6 border-l-4 border-indigo-500 pl-3">Комментарии</h2>
                    <form id="comment-form" class="mb-8 p-4 rounded-xl border border-zinc-800">
                        <textarea id="comment-text" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-sm focus:border-indigo-500 outline-none transition resize-none" rows="3" placeholder="Напишите здесь комментарий..."></textarea>
                        <div class="flex justify-end mt-3">
                            <button type="submit" id="submit-btn" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-lg text-sm font-bold transition">Отправить</button>
                        </div>
                    </form>
                    <div id="comments-list" class="space-y-4"></div>
                    <div id="pagination" class="flex justify-center items-center gap-3 mt-8"></div>
                </div>
            </div>
        `;

        // --- РЕНДЕР СКРИНШОТОВ ---
        const screenshotContainer = document.getElementById('screenshots-section');
        if (gameImages.length > 0) {
            screenshotContainer.innerHTML = `
                <h2 class="text-xl font-bold mb-6 border-l-4 border-blue-500 pl-3">Скриншоты</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    ${gameImages.map((img, index) => `
                        <div class="overflow-hidden rounded-xl bg-zinc-900 aspect-video cursor-pointer" onclick="openLightbox(${index})">
                            <img src="${img.image}"
                                 alt="Screenshot"
                                 class="w-full h-full object-cover hover:scale-105 transition-transform duration-300 shadow-lg">
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // --- РЕНДЕР ТОРРЕНТОВ ---
        const torrentSection = document.getElementById('torrent-section');
        if (game.torrents && game.torrents.length > 0) {
            torrentSection.innerHTML = `
                <h2 class="text-xl font-bold mb-6 border-l-4 border-green-500 pl-3">Скачать Торрент</h2>
                <div class="flex flex-col gap-4">
                    ${game.torrents.map(t => `
                        <a href="${t.magnet}" class="group flex items-center justify-between bg-zinc-900 p-5 hover:bg-zinc-800 hover:border-green-500/50 transition-all duration-300 shadow-lg">
                            <div class="flex items-center gap-3">
                                <div class="bg-green-500/10 p-2 rounded-lg group-hover:bg-green-500/20">
                                    <span class="text-green-500 font-bold text-xl">⬇</span>
                                </div>
                                <div>
                                    <div class="text-lg font-semibold text-white group-hover:text-green-400">${t.name}</div>
                                    <div class="text-sm text-gray-500">${t.size} GB</div>
                                </div>
                            </div>
                            <span class="hidden md:block text-xs font-mono text-gray-600 bg-black/30 px-3 py-1 rounded">MAGNET LINK</span>
                        </a>
                    `).join('')}
                    <p class="text-xs text-zinc-500 mt-2">🛡️ Все файлы проверены. У нас только безопасные торренты.</p>
                </div>
            `;
        }

        // --- РЕНДЕР ПОХОЖИХ ИГР (КАРУСЕЛЬ ИЗ game.similar) ---
        const similarSection = document.getElementById('similar-games-section');
        if (game.similar && game.similar.length > 0) {
            similarSection.innerHTML = `
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold border-l-4 border-yellow-500 pl-3">Похожие игры</h2>
                    <div class="flex gap-2">
                        <button onclick="scrollSimilar(-1)" class="bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 hover:border-yellow-500/50 p-2 rounded-lg text-white transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <button onclick="scrollSimilar(1)" class="bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 hover:border-yellow-500/50 p-2 rounded-lg text-white transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="relative group">
                    <div id="similar-carousel" class="flex gap-4 overflow-x-auto snap-x snap-mandatory pb-4 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
                        ${game.similar.map(sg => `
                            <a href="/game/${sg.slug || sg.id}" class="snap-start shrink-0 w-[180px] md:w-[200px] group flex flex-col overflow-hidden  hover:border-yellow-500/50 transition-all duration-300">
                                <div class="aspect-[3/4] w-full overflow-hidden relative">
                                    <img src="${sg.background_image || ''}" alt="${sg.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                    <div class="absolute top-2 right-2 bg-black/80 backdrop-blur-sm border border-yellow-500/30 text-yellow-500 font-bold text-xs px-2 py-1 flex items-center gap-1 shadow-lg">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                        ${sg.metacritic || '0.0'}
                                    </div>
                                </div>
                                <div class="p-3">
                                    <h3 class="text-sm font-bold text-white truncate">${sg.name}</h3>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        const commentsList = document.getElementById('comments-list');
        const pagination = document.getElementById('pagination');

        // --- ЛОГИКА КОММЕНТАРИЕВ ---
        const renderComments = (comments) => {
            if (!comments || comments.length === 0) {
                commentsList.innerHTML = '<p class="text-zinc-600 italic">Комментариев пока нет. Будьте первым!</p>';
                return;
            }
            commentsList.innerHTML = comments.map(c => `
                <div class="flex flex-row gap-3 bg-zinc-900/50 border border-zinc-800 p-4 rounded-lg">
                    <img src="/${c.user_avatar}" class="w-16 h-16 rounded-full" alt="user-photo">

                    <div class="flex flex-col flex-1">
                        <div class="flex justify-between items-center w-full mb-2">
                            <span class="text-indigo-400 font-bold text-sm truncate mr-4">
                                ${c.user}
                            </span>
                            <span class="text-zinc-500 text-[12px] whitespace-nowrap shrink-0">
                                ${formatDate(c.created_at)}
                            </span>
                        </div>

                        <span class="text-gray-300 text-sm">
                            ${c.content}
                        </span>
                    </div>
                </div>
            `).join('');
        };

        const renderPagination = (page, hasNext) => {
            pagination.innerHTML = '';
            if (page > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = "bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg text-xs font-medium transition text-gray-300";
                prevBtn.innerText = "Назад";
                prevBtn.onclick = () => {
                    currentPage--;
                    loadComments(currentPage, false);
                };
                pagination.appendChild(prevBtn);
            }
            const indicator = document.createElement('span');
            indicator.className = "bg-indigo-600/20 text-indigo-400 px-4 py-2 rounded-lg text-xs font-bold border border-indigo-500/30";
            indicator.innerText = page;
            pagination.appendChild(indicator);
            if (hasNext) {
                const nextBtn = document.createElement('button');
                nextBtn.className = "bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg text-xs font-medium transition text-gray-300";
                nextBtn.innerText = "Вперед";
                nextBtn.onclick = () => {
                    currentPage++;
                    loadComments(currentPage, false);
                };
                pagination.appendChild(nextBtn);
            }
        };

        const loadComments = async (page = 1, useCache = true) => {
            const offset = (page - 1) * LIMIT;
            if (page === 1 && useCache) {
                const cached = sessionStorage.getItem(cacheKey);
                if (cached) renderComments(JSON.parse(cached));
            }
            try {
                const res = await fetch('/comments/all', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: game.id, offset: offset, limit: LIMIT})
                });
                if (res.ok) {
                    const data = await res.json();
                    renderComments(data);
                    renderPagination(page, data.length === LIMIT);
                    if (page === 1) sessionStorage.setItem(cacheKey, JSON.stringify(data));
                }
            } catch (e) {
                console.error(e);
            }
        };

        document.getElementById('comment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const textarea = document.getElementById('comment-text');
            const submitBtn = document.getElementById('submit-btn');
            const content = textarea.value.trim();
            if (!content) return;
            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';
            try {
                const response = await fetch('/comments/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: game.id, content: content})
                });
                if (response.ok) {
                    const newComment = await response.json();
                    textarea.value = '';
                    const cached = JSON.parse(sessionStorage.getItem(cacheKey) || "[]");
                    const updated = [newComment, ...cached].slice(0, LIMIT);
                    sessionStorage.setItem(cacheKey, JSON.stringify(updated));
                    renderComments(updated);
                    renderPagination(1, updated.length === LIMIT);
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Отправить';
            }
        });

        // Запуск загрузки
        loadComments(1);
    });
</script>
{% endblock %}
