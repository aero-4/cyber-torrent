<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}КИБЕР ТОРРЕНТ{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        @layer base {
            body {
                @apply bg-black text-blue-500 antialiased min-h-screen;
                font-family: 'Space Mono', monospace;
            }

            ::-webkit-scrollbar { width: 8px; }
            ::-webkit-scrollbar-track { @apply bg-black; }
            ::-webkit-scrollbar-thumb { @apply bg-blue-900 border-2 border-black hover:bg-blue-600; }

            h1, h2, h3, h4 { @apply font-bold uppercase tracking-tighter text-white; }
            h1 { @apply text-4xl sm:text-6xl mb-6 border-b-4 border-blue-600 pb-2; }
            h2 { @apply text-3xl sm:text-4xl mb-4 border-l-8 border-blue-600 pl-4; }
            h3 { @apply text-2xl mb-2 text-blue-400; }

            p { @apply mb-4 leading-relaxed text-lg text-blue-400/90; }
            a { @apply transition-all duration-200 cursor-pointer; }

            input, select, textarea {
                @apply w-full border-4 border-blue-600 bg-black px-6 py-4 text-xl text-blue-400
                       placeholder:text-blue-900 outline-none focus:bg-blue-950 transition-colors rounded-none;
            }

            button {
                @apply border-4 border-blue-600 bg-blue-600 px-8 py-4 text-xl font-bold
                       text-black uppercase tracking-widest hover:bg-black hover:text-blue-600
                       transition-all active:translate-x-1 active:translate-y-1 rounded-none;
            }

            table { @apply w-full border-collapse border-4 border-blue-900 my-6; }
            th { @apply border-2 border-blue-900 bg-blue-950 p-4 text-left uppercase text-white; }
            td { @apply border-2 border-blue-900 p-4 font-mono; }
            tr:hover { @apply bg-blue-900/20; }

            input:-webkit-autofill {
                -webkit-text-fill-color: #3b82f6;
                -webkit-box-shadow: 0 0 0px 1000px #000 inset;
            }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .scanline::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(37,99,235,0.05), transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }
    </style>
</head>
<body >

    <header class="border-b-8 border-blue-600 bg-black sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
            <a href="/" class="group">
                <div class="text-3xl sm:text-5xl font-bold tracking-tighter uppercase text-white group-hover:skew-x-12 transition-transform">
                    КИБЕР<span class="text-blue-600">.TORRENT</span>
                </div>
            </a>

            <div class="relative group">
                <button class="">
                    Категории <span class="text-xs">▼</span>
                </button>

                <div id="categoriesDropdown" class="absolute top-full left-0 w-64 bg-black border-4 border-blue-600 hidden group-hover:grid grid-cols-1 z-[100] shadow-[10px_10px_0px_#000]">
                    <div class="p-4 text-sm animate-pulse text-blue-900">Загрузка категорий...</div>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <nav class="hidden md:flex gap-8 text-xl font-bold uppercase">
                    <a href="/" class="hover:text-white border-b-2 border-transparent hover:border-blue-600">Главная</a>
                    <a href="/faq" class="hover:text-white border-b-2 border-transparent hover:border-blue-600">Инфо</a>
                </nav>

                <button id="burgerBtn" class="!p-2 !bg-transparent border-2">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <nav id="mobileMenu" class="hidden absolute top-full right-0 w-full sm:w-96 border-b-8 border-l-0 sm:border-l-8 border-blue-600 bg-black shadow-[20px_20px_0px_#000]">
            <div class="flex flex-col p-8 space-y-6 text-2xl font-bold uppercase">
                <div id="guestLinks" class="flex flex-col gap-4">
                    <a href="/login" class="hover:pl-4 hover:bg-blue-600 hover:text-black p-2 transition-all">Войти</a>
                    <a href="/register" class="hover:pl-4 hover:bg-blue-600 hover:text-black p-2 transition-all">Регистрация</a>
                </div>

                <div id="authLinks" class="hidden flex flex-col gap-4">
                    <a href="/profile" class="hover:pl-4 hover:bg-blue-600 hover:text-black p-2 text-white transition-all">Профиль</a>
                    <button onclick="window.AuthContext.logout()" class="!bg-transparent !border-red-600 !text-red-600 hover:!bg-red-600 hover:!text-black !text-left !px-2 !py-2 transition-all">
                        Выход
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow w-full max-w-7xl mx-auto p-4 sm:p-12 min-h-screen">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t-8 border-blue-900 bg-black p-10 mt-auto">
        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            <div class="uppercase">
                <div class="text-2xl font-bold text-white mb-2">CYBERPUNK TORRENT TRACKER</div>
                <p class="text-sm text-blue-900 m-0">Все права защищены законом о цифровом суверенитете 2026.</p>
            </div>
            <div class="flex md:justify-end gap-10 font-bold uppercase">
                <a href="/" class="hover:text-white">Главная</a>
                <a href="/faq" class="hover:text-white">FAQ</a>
            </div>
        </div>
    </footer>

    <script>
        // Управление меню
        const burgerBtn = document.getElementById('burgerBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        burgerBtn.onclick = () => mobileMenu.classList.toggle('hidden');

        // Глобальный Auth Context (Vanilla JS порт твоего React хука)
        window.AuthContext = {
            user: null,
            isAuthenticated: false,
            loading: true,
            refreshIntervalRef: null,

            // Настройка API путей (поменяй если у тебя они другие)
            endpoints: {
                me: "/users/me",
                refresh: "/auth/refresh",
                logout: "/auth/logout"
            },

            async init() {
                await this.fetchCurrentUser();
            },

            handleNotAuthenticated() {
                this.user = null;
                this.isAuthenticated = false;
                this.stopInterval();
                this.updateUI();
            },

            // 1. Получение данных юзера
            async fetchCurrentUser() {
                this.loading = true;
                try {
                    const res = await fetch(this.endpoints.me, {
                        method: "GET",
                        headers: { "Accept": "application/json" }
                    });

                    if (!res.ok) {
                        this.handleNotAuthenticated();
                        return;
                    }

                    const json = await res.json();
                    this.user = json;
                    this.isAuthenticated = true;
                    this.startInterval(); // Запускаем цикл рефреша
                } catch (err) {
                    console.error("fetchCurrentUser error", err);
                    this.handleNotAuthenticated();
                } finally {
                    this.loading = false;
                    this.updateUI();
                }
            },

            // 2. Рефреш токена
            async refreshToken() {
                try {
                    const res = await fetch(this.endpoints.refresh, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" }
                    });

                    if (!res.ok) {
                        this.handleNotAuthenticated();
                        return;
                    }

                    // Если рефреш успешен, обновляем данные пользователя
                    await this.fetchCurrentUser();
                } catch (err) {
                    console.error("refreshToken error", err);
                    this.handleNotAuthenticated();
                }
            },

            // 3. Управление интервалом (15 минут = 900 000 мс)
            startInterval() {
                if (this.refreshIntervalRef) return; // Уже запущен
                this.refreshIntervalRef = window.setInterval(() => {
                    this.refreshToken();
                }, 15 * 60 * 1000);
            },

            stopInterval() {
                if (this.refreshIntervalRef) {
                    clearInterval(this.refreshIntervalRef);
                    this.refreshIntervalRef = null;
                }
            },

            async logout() {
                try {
                    await fetch(this.endpoints.logout, { method: "POST" });
                } catch (e) {
                    console.warn("logout error", e);
                }
                this.handleNotAuthenticated();
                window.location.assign("/");
            },

            // Обновление DOM-элементов
            updateUI() {
                const guestLinks = document.getElementById('guestLinks');
                const authLinks = document.getElementById('authLinks');
                const status = document.getElementById('userStatus');

                if (this.isAuthenticated && this.user) {
                    guestLinks.classList.add('hidden');
                    authLinks.classList.remove('hidden');
                    // // Достаем email/username (подстрой под ответ своего бэка)
                    // const identifier = this.user.email || this.user.username || 'USER';
                    // status.innerHTML = `АККАУНТ: <span class="text-white">${identifier}</span>`;
                    // status.classList.remove('opacity-50');
                } else {
                    guestLinks.classList.remove('hidden');
                    authLinks.classList.add('hidden');
                    // status.innerHTML = "STATUS: UNAUTHORIZED_VISITOR";
                    // status.classList.add('opacity-50');
                }
            }
        };

        async function loadCategories() {
            const dropdown = document.getElementById('categoriesDropdown');
            try {
                const res = await fetch('/categories/');
                const categories = await res.json();

                dropdown.innerHTML = categories.map(cat => `
                    <a href="/category/${cat.name}" class="flex items-center gap-3 p-3 hover:bg-blue-600 hover:text-black transition-all border-b border-blue-900 last:border-none">
                        ${cat.image ? `<img src="${cat.image}" class="w-10 h-10 object-cover border border-blue-400">` : ''}
                        <span class="truncate">${cat.name}</span>
                    </a>
                `).join('');
            } catch (e) {
                dropdown.innerHTML = '<div class="p-4 text-red-600 text-xs">ERR: CATEGORY_OFFLINE</div>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadCategories);

        document.addEventListener('DOMContentLoaded', () => {
            window.AuthContext.init();
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
