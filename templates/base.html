<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SYS.REGISTRATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        body {
            background-color: #000000;
            font-family: 'Space Mono', monospace;
            color: #3b82f6; /* Tailwind blue-500 */
        }

        /* Жесткий стиль для инпутов без скруглений */
        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            transition: background-color 0s 600000s, color 0s 600000s;
            -webkit-text-fill-color: #3b82f6;
            -webkit-box-shadow: 0 0 0px 1000px #000 inset;
        }

        /* Анимация глитча/появления попапа */
        @keyframes popup-appear {
            0% {
                transform: scaleY(0);
                border-color: #fff;
            }
            50% {
                transform: scaleY(1.1);
            }
            100% {
                transform: scaleY(1);
            }
        }

        .alien-popup {
            animation: popup-appear 0.2s cubic-bezier(0, 1, .3, 1) forwards;
            transform-origin: center;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>{% block header %}CSRF Vulnerable Payment System{% endblock %}</h1>
    {% if user %}
    <p>Logged in as: <strong>{{ user.username }}</strong> |
        Balance: <span class="balance">${{ "%.2f"|format(user.balance) }}</span></p>
    <a href="/logout">
        <button class="logout">Logout</button>
    </a>
    {% endif %}
</div>
{% block content %}{% endblock %}
</body>
<script src="https://cdn.tailwindcss.com"></script>

</html>
