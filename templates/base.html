<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}КИБЕР ТОРРЕНТ{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        @layer base {
            body {
                @apply bg-black text-blue-500 antialiased min-h-screen transition-colors duration-300;
                font-family: 'Space Mono', monospace;
            }

            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                @apply bg-black;
            }

            ::-webkit-scrollbar-thumb {
                @apply bg-blue-900 border-2 border-black hover:bg-blue-600;
            }

            h1, h2, h3, h4 {
                @apply font-bold uppercase tracking-tighter text-white transition-colors duration-300;
            }

            /* Заменили скучный бордер H1 на кибер-линию */
            h1 {
                @apply text-4xl sm:text-6xl mb-6 pb-2 relative inline-block;
            }


            h2 {
                @apply text-3xl sm:text-4xl mb-4 border-l-8 border-blue-600 pl-4;
            }

            h3 {
                @apply text-2xl mb-2 text-blue-400;
            }

            p {
                @apply mb-4 leading-relaxed text-lg text-blue-400/90;
            }

            a {
                @apply transition-all duration-200 cursor-pointer;
            }

            input, select, textarea {
                @apply w-full border-4 border-blue-600 bg-black px-6 py-4 text-xl text-blue-400 placeholder:text-blue-900 outline-none focus:bg-blue-950 transition-colors rounded-none;
            }

            button {
                @apply border-4 border-blue-600 bg-blue-600 px-8 py-4 text-xl font-bold text-black uppercase tracking-widest hover:bg-black hover:text-blue-600 transition-all active:translate-x-1 active:translate-y-1 rounded-none;
            }

            table {
                @apply w-full border-collapse border-4 border-blue-900 my-6 transition-colors duration-300;
            }

            th {
                @apply border-2 border-blue-900 bg-blue-950 p-4 text-left uppercase text-white transition-colors duration-300;
            }

            td {
                @apply border-2 border-blue-900 p-4 font-mono transition-colors duration-300;
            }

            tr:hover {
                @apply bg-blue-900/20;
            }

            .sidebar-link {
                @apply text-blue-400;
            }

            .sidebar-link:hover {
                @apply bg-blue-600 text-black;
            }
        }


        .cyber-animated-line {
            background: linear-gradient(90deg, #00f0ff, #ff003c, #fcee0a, #00f0ff);
            background-size: 300% 100%;
            animation: cyber-gradient 3s linear infinite;
        }

        @keyframes cyber-gradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .hologram-text {
            color: #fff;
            position: relative;
            text-shadow:
                0 0 8px rgba(0, 240, 255, 0.8),
                -3px 0 0 rgba(255, 0, 60, 0.7),
                3px 0 0 rgba(0, 240, 255, 0.7);
            animation: hologram-flicker 4s infinite alternate;
        }

        @keyframes hologram-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                text-shadow:
                    0 0 10px rgba(0, 240, 255, 0.9),
                    -3px 0 0 rgba(255, 0, 60, 0.8),
                    3px 0 0 rgba(0, 240, 255, 0.8);
            }
            20%, 24%, 55% {
                opacity: 0.6;
                text-shadow: none;
            }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<header class="bg-black sticky top-0 z-50 transition-colors duration-300 relative">

    <div class="cyber-animated-line absolute bottom-0 left-0 w-full h-2"></div>

    <div class="mx-auto px-4 py-6 flex justify-between items-center gap-4">
        <a href="/" class="group shrink-0 relative">
            <div class="logo-text hologram-text text-3xl sm:text-5xl font-bold tracking-tighter uppercase text-white group-hover:skew-x-12 transition-transform inline-block">
                КИБЕР<span class="text-blue-500" style="text-shadow: none;">.TORRENT</span>
            </div>
        </a>

        <div class="flex items-center gap-2 sm:gap-3 ml-auto">
            <button id="mobileCategoriesBtn" type="button" class="md:hidden !bg-transparent !border-2 !border-blue-600 !text-blue-500 hover:!bg-blue-600 hover:!text-black !px-3 !py-2 flex items-center gap-2">
                <span>Категории</span>
                <span id="mobileCategoriesArrow" class="transition-transform text-sm">▼</span>
            </button>

            <button id="burgerBtn" type="button" class="!bg-transparent !border-2 !border-blue-600 !text-blue-500 hover:!bg-blue-600 hover:!text-black !px-3 sm:!px-4 !py-2 flex items-center gap-2">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
                <span class="hidden sm:inline">Меню</span>
            </button>
        </div>
    </div>

    <div id="mobileCategoriesDropdown" class="hidden md:hidden absolute right-0 top-full mt-2 w-[min(92vw,20rem)] bg-black border-4 border-blue-600 shadow-[16px_16px_0px_rgba(37,99,235,0.25)] z-[60]">
        <div id="mobileCategoriesList" class="flex flex-col">
            <div class="p-4 text-sm animate-pulse text-blue-900">Загрузка категорий...</div>
        </div>
    </div>

    <nav id="mobileMenu" class="hidden fixed right-0 bottom-0 w-full sm:w-96 bg-black border-l-0 sm:border-l-8 border-blue-600 shadow-[20px_20px_0px_rgba(37,99,235,0.2)] overflow-y-auto z-[55]">
        <div class="flex flex-col p-6 sm:p-8 gap-6 text-xl font-bold uppercase">
            <div id="guestLinks" class="flex flex-col gap-4">
                <a href="/login" class="hover:pl-4 hover:bg-blue-600 hover:text-black p-2 transition-all">Войти</a>
                <a href="/register" class="hover:pl-4 hover:bg-blue-600 hover:text-black p-2 transition-all">Регистрация</a>
            </div>

            <div id="authLinks" class="hidden flex flex-col gap-4">
                <a href="/profile" class="hover:pl-4 hover:bg-blue-600 hover:text-black p-2 transition-all">
                    Профиль
                </a>
                <button onclick="window.AuthContext.logout()" type="button" class="!bg-transparent !border-red-600 !text-red-600 hover:!bg-red-600 hover:!text-white !text-left !px-2 !py-2 transition-all">
                    Выход
                </button>
            </div>
        </div>
    </nav>
</header>

<main class="flex-grow w-full">
    <div class="mx-auto py-4 sm:px-12 grid grid-cols-1 md:grid-cols-[18rem_minmax(0,1fr)] gap-8 items-start">
        <aside id="categoriesPanel" class="hidden md:block sticky self-start">
            <div class="border-4 border-blue-600 bg-black shadow-[10px_10px_0px_rgba(37,99,235,0.2)]">
                <div class="border-b-4 border-blue-600 px-5 py-4 text-2xl font-bold uppercase text-white">
                    Категории
                </div>
                <div id="desktopCategories" class="flex flex-col">
                    <div class="p-4 text-sm animate-pulse text-blue-900">Загрузка категорий...</div>
                </div>
            </div>
        </aside>

        <section class="min-w-0">
            {% block content %}
            <h1>Добро пожаловать</h1>
            <p>Система функционирует нормально.</p>
            {% endblock %}
        </section>
    </div>
</main>

<footer class="bg-black p-10 mt-auto transition-colors duration-300 relative">
    <div class="cyber-animated-line absolute top-0 left-0 w-full h-2"></div>
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        <div class="uppercase">
            <div class="logo-text hologram-text text-2xl font-bold text-white mb-2 inline-block">КИБЕР.TORRENT</div>
            <p class="text-sm text-blue-900 m-0">ALL RIGHTS RESERVED 2026.</p>
        </div>
        <div class="flex md:justify-end gap-10 font-bold uppercase">
            <a href="/" class="hover:text-blue-500">Главная</a>
            <a href="/faq" class="hover:text-blue-500">FAQ</a>
        </div>
    </div>
</footer>

<script>
    const header = document.querySelector('header');
    const burgerBtn = document.getElementById('burgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileCategoriesBtn = document.getElementById('mobileCategoriesBtn');
    const mobileCategoriesDropdown = document.getElementById('mobileCategoriesDropdown');
    const mobileCategoriesArrow = document.getElementById('mobileCategoriesArrow');

    function syncHeaderHeight() {
        document.documentElement.style.setProperty('--header-h', `${header.offsetHeight}px`);
        mobileMenu.style.top = `var(--header-h)`;
    }

    burgerBtn.onclick = () => {
        mobileMenu.classList.toggle('hidden');
        syncHeaderHeight();
    };

    mobileCategoriesBtn.onclick = (e) => {
        e.stopPropagation();
        const open = mobileCategoriesDropdown.classList.contains('hidden');
        mobileCategoriesDropdown.classList.toggle('hidden');
        mobileCategoriesArrow.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
    };

    document.addEventListener('click', (e) => {
        if (!mobileCategoriesDropdown.contains(e.target) && !mobileCategoriesBtn.contains(e.target)) {
            mobileCategoriesDropdown.classList.add('hidden');
            mobileCategoriesArrow.style.transform = 'rotate(0deg)';
        }
    });

    window.addEventListener('resize', syncHeaderHeight);

    async function loadCategories() {
        const categories = {
            "Приключения": "Adventure",
            "Инди": "Indie",
            "Шутер": "Shooter",
            "Казуальные": "Casual",
            "Семейные": "Family",
            "Гонки": "Racing",
            "Экшен": "Action",
            "РПГ": "RPG",
            "Кооператив": "Massively Multiplayer",
            "Стратегии": "Strategy",
            "Платформер": "Platformer"
        };

        const desktopCategories = document.getElementById('desktopCategories');
        const mobileCategoriesList = document.getElementById('mobileCategoriesList');

        try {
            desktopCategories.innerHTML = Object.entries(categories).map(([ru, en]) => `
                <a href="/?category=${encodeURIComponent(en)}" class="sidebar-link block px-5 py-3 border-b border-blue-900 last:border-none hover:bg-blue-600 hover:text-black transition-all">
                    ${ru}
                </a>
            `).join('');

            mobileCategoriesList.innerHTML = Object.entries(categories).map(([ru, en]) => `
                <a href="/?category=${encodeURIComponent(en)}" class="block px-4 py-3 border-b border-blue-900 last:border-none hover:bg-blue-600 hover:text-black transition-all">
                    ${ru}
                </a>
            `).join('');
        } catch (e) {
            desktopCategories.innerHTML = '<div class="p-4 text-red-600 text-xs">Ошибка загрузки</div>';
            mobileCategoriesList.innerHTML = '<div class="p-4 text-red-600 text-xs">Ошибка загрузки</div>';
            console.error(e);
        }
    }

    window.AuthContext = {
        async logout() {
            await fetch("/auth/logout", { method: "POST" });
            window.location.href = "/";
        },

        async init() {
            try {
                const res = await fetch("/users/me");
                if (res.ok) {
                    document.getElementById('guestLinks').classList.add('hidden');
                    document.getElementById('authLinks').classList.remove('hidden');
                }
            } catch {}
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        syncHeaderHeight();
        loadCategories();
        window.AuthContext.init();
    });
</script>

{% block scripts %}{% endblock %}

</body>
</html>
