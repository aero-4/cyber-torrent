<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}КИБЕР ТОРРЕНТ{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        @layer base {
            body {
                @apply bg-black text-blue-500 antialiased min-h-screen transition-colors duration-300;
                font-family: 'Space Mono', monospace;
            }

            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                @apply bg-black;
            }

            ::-webkit-scrollbar-thumb {
                @apply bg-blue-900 border-2 border-black hover:bg-blue-600;
            }

            h1, h2, h3, h4 {
                @apply font-bold uppercase tracking-tighter text-white transition-colors duration-300;
            }

            h1 {
                @apply text-4xl sm:text-6xl mb-6 pb-2 relative inline-block;
            }

            h2 {
                @apply text-3xl sm:text-4xl mb-4 border-l-8 border-blue-600 pl-4;
            }

            h3 {
                @apply text-2xl mb-2 text-blue-400;
            }

            p {
                @apply mb-4 leading-relaxed text-lg text-blue-400/90;
            }

            a {
                @apply transition-all duration-200 cursor-pointer;
            }

            input, select, textarea {
                @apply w-full border-4 border-blue-600 bg-black px-6 py-4 text-xl text-blue-400 placeholder:text-blue-900 outline-none focus:bg-blue-950 transition-colors rounded-none;
            }

            button {
                @apply border-4 border-blue-600 bg-blue-600 px-8 py-4 text-xl font-bold text-black uppercase tracking-widest hover:bg-black hover:text-blue-600 transition-all active:translate-x-1 active:translate-y-1 rounded-none;
            }

            table {
                @apply w-full border-collapse border-4 border-blue-900 my-6 transition-colors duration-300;
            }

            th {
                @apply border-2 border-blue-900 bg-blue-950 p-4 text-left uppercase text-white transition-colors duration-300;
            }

            td {
                @apply border-2 border-blue-900 p-4 font-mono transition-colors duration-300;
            }

            tr:hover {
                @apply bg-blue-900/20;
            }

            .sidebar-link {
                @apply text-blue-400;
            }

            .sidebar-link:hover {
                @apply bg-blue-600 text-black;
            }
        }

        .cyber-animated-line {
            background: linear-gradient(90deg, #00f0ff, #ff003c, #fcee0a, #00f0ff);
            background-size: 300% 100%;
            animation: cyber-gradient 3s linear infinite;
        }

        @keyframes cyber-gradient {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        .hologram-text {
            color: #fff;
            position: relative;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8),
            -3px 0 0 rgba(255, 0, 60, 0.7),
            3px 0 0 rgba(0, 240, 255, 0.7);
            animation: hologram-flicker 4s infinite alternate;
        }

        @keyframes hologram-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                text-shadow: 0 0 10px rgba(0, 240, 255, 0.9),
                -3px 0 0 rgba(255, 0, 60, 0.8),
                3px 0 0 rgba(0, 240, 255, 0.8);
            }
            20%, 24%, 55% {
                opacity: 0.6;
                text-shadow: none;
            }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<header class="bg-black sticky top-0 z-50 transition-colors duration-300 relative">
    <div class="cyber-animated-line absolute bottom-0 left-0 w-full h-2"></div>

    <div class="mx-auto px-4 py-4 sm:py-6 flex flex-col md:flex-row md:justify-between md:items-center gap-4">

        <div class="flex justify-between items-center w-full md:w-auto">
            <a href="/" class="group shrink-0 relative">
                <div class="logo-text hologram-text text-2xl sm:text-4xl font-bold tracking-tighter uppercase text-white group-hover:skew-x-12 transition-transform inline-block">
                    КИБЕР<span class="text-blue-500" style="text-shadow: none;">.TORRENT</span>
                </div>
            </a>

            <div class="flex items-center gap-2 md:hidden">
                <button id="mobileCategoriesBtn" type="button"
                        class="!bg-transparent !border-2 !border-blue-600 !text-blue-500 hover:!bg-blue-600 hover:!text-black !px-3 !py-2 flex items-center gap-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                    </svg>
                    <span id="mobileCategoriesArrow" class="transition-transform text-xs">▼</span>
                </button>

                <button id="burgerBtn" type="button" class="!bg-transparent !border-2 !border-blue-600 !text-blue-500 hover:!bg-blue-600 hover:!text-black !px-3 !py-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto">
            <form action="/" method="GET" class="flex flex-row w-full md:w-auto gap-1 items-center">
                <input
                        type="text"
                        name="query"
                        placeholder="Поиск игр..."
                        required
                        class="!border-2 !px-3 !py-2 !text-sm flex-grow md:w-48 lg:w-64 focus:bg-blue-900/20 transition-all"
                >
                <button type="submit" class="!border-2 !px-3 !py-2 !min-w-0 flex items-center justify-center shrink-0" aria-label="Искать">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </form>

            <button id="burgerBtnDesktop" type="button"
                    class="hidden md:flex !bg-transparent !border-2 !border-blue-600 !text-blue-500 hover:!bg-blue-600 hover:!text-black !px-4 !py-2 items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
                <span>Меню</span>
            </button>
        </div>
    </div>

    <div id="mobileCategoriesDropdown" class="hidden md:hidden absolute left-4 right-4 top-full mt-2 bg-black border-4 border-blue-600 shadow-[10px_10px_0px_rgba(37,99,235,0.25)] z-[60]">
        <div id="mobileCategoriesList" class="flex flex-col max-h-[60vh] overflow-y-auto">
            <div class="p-4 text-sm animate-pulse text-blue-900">Загрузка категорий...</div>
        </div>
    </div>

    <nav id="mobileMenu" class="hidden fixed right-0 bottom-0 w-full sm:w-80 bg-black border-l-0 sm:border-l-8 border-blue-600 shadow-2xl overflow-y-auto z-[55]">
        <div class="flex flex-col p-8 gap-6 text-xl font-bold uppercase">
            <div id="guestLinks" class="flex flex-col gap-4">
                <a href="/login" class="hover:pl-4 hover:bg-blue-600 hover:text-black p-2 transition-all">Войти</a>
                <a href="/register" class="hover:pl-4 hover:bg-blue-600 hover:text-black p-2 transition-all">Регистрация</a>
            </div>
            <div id="authLinks" class="hidden flex flex-col gap-4">
                <a href="/profile" class="hover:pl-4 hover:bg-blue-600 hover:text-black p-2 transition-all">Профиль</a>
                <button onclick="window.AuthContext.logout()" type="button"
                        class="!bg-transparent !border-red-600 !text-red-600 hover:!bg-red-600 hover:!text-white !text-left !px-2 !py-2 transition-all">
                    Выход
                </button>
            </div>
        </div>
    </nav>
</header>

<main class="flex-grow w-full">
    <div class="mx-auto py-6 px-4 sm:px-12 grid grid-cols-1 md:grid-cols-[16rem_1fr] gap-8 items-start">
        <aside id="categoriesPanel" class="hidden md:block sticky top-28">
            <div class="border-4 border-blue-600 bg-black shadow-[8px_8px_0px_rgba(37,99,235,0.2)]">
                <div id="desktopCategories" class="flex flex-col">
                </div>
            </div>
        </aside>

        <section class="min-w-0">
            {% block content %}
            <h1>Добро пожаловать</h1>
            <p>Система функционирует нормально. Все протоколы поиска активны.</p>
            {% endblock %}
        </section>
    </div>
</main>

<footer class="bg-black p-10 mt-auto transition-colors duration-300 relative">
    <div class="cyber-animated-line absolute top-0 left-0 w-full h-2"></div>
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left">
        <div class="uppercase">
            <div class="logo-text hologram-text text-xl font-bold text-white mb-1 inline-block">КИБЕР.TORRENT</div>
            <p class="text-[10px] text-blue-900 m-0">ESTABLISHED 2026 // CORE_UPDATE_V.4</p>
        </div>
        <div class="flex gap-8 font-bold uppercase text-sm">
            <a href="/" class="hover:text-white transition-colors">Главная</a>
            <a href="/faq" class="hover:text-white transition-colors">FAQ</a>
        </div>
    </div>
</footer>

<script>
    const header = document.querySelector('header');
    const burgerBtn = document.getElementById('burgerBtn');
    const burgerBtnDesktop = document.getElementById('burgerBtnDesktop');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileCategoriesBtn = document.getElementById('mobileCategoriesBtn');
    const mobileCategoriesDropdown = document.getElementById('mobileCategoriesDropdown');
    const mobileCategoriesArrow = document.getElementById('mobileCategoriesArrow');

    function syncHeaderHeight() {
        document.documentElement.style.setProperty('--header-h', `${header.offsetHeight}px`);
        mobileMenu.style.top = `${header.offsetHeight}px`;
    }

    const toggleMenu = () => {
        mobileMenu.classList.toggle('hidden');
        syncHeaderHeight();
    };

    burgerBtn.onclick = toggleMenu;
    burgerBtnDesktop.onclick = toggleMenu;

    mobileCategoriesBtn.onclick = (e) => {
        e.stopPropagation();
        const isHidden = mobileCategoriesDropdown.classList.toggle('hidden');
        mobileCategoriesArrow.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
    };

    document.addEventListener('click', (e) => {
        if (!mobileCategoriesDropdown.contains(e.target) && !mobileCategoriesBtn.contains(e.target)) {
            mobileCategoriesDropdown.classList.add('hidden');
            mobileCategoriesArrow.style.transform = 'rotate(0deg)';
        }
    });

    window.addEventListener('resize', syncHeaderHeight);

    async function loadCategories() {
        const gameCategories = [
            ["Приключения", "Adventure"],
            ["Инди", "Indie"],
            ["Шутер", "Shooter"],
            ["Казуальные", "Casual"],
            ["Семейные", "Family"],
            ["Гонки", "Racing"],
            ["Экшен", "Action"],
            ["РПГ", "RPG"],
            ["Кооператив", "Massively Multiplayer"],
            ["Стратегии", "Strategy"],
            ["Платформер", "Platformer"],
        ];

        const years = Array.from({length: 2026 - 2000 + 1}, (_, i) => 2026 - i);

        const desktop = document.getElementById('desktopCategories');
        const mobile = document.getElementById('mobileCategoriesList');

        const renderLinks = (items, hrefBuilder) =>
            items.map(([ru, en]) => `
                <a href="${hrefBuilder(en)}" class="sidebar-link block px-4 py-3 border-b border-blue-900 last:border-none hover:bg-blue-600 hover:text-black transition-all">
                    ${ru}
                </a>
            `).join('');

        const renderYearLinks = (items, hrefBuilder) =>
            items.map(year => `
                <a href="${hrefBuilder(year)}" class="sidebar-link block px-4 py-3 border-b border-blue-900 last:border-none hover:bg-blue-600 hover:text-black transition-all">
                    ${year}
                </a>
            `).join('');

        const html = `
            <div class="border-b-4 border-blue-600 px-4 py-3 text-xl font-bold uppercase text-white bg-blue-900/20">
                Категории
            </div>
            ${renderLinks(gameCategories, en => `/?category=${encodeURIComponent(en)}`)}

            <div class="border-t-4 border-blue-600 px-4 py-3 text-xl font-bold uppercase text-white bg-blue-900/20">
                По годам
            </div>
            ${renderYearLinks(years, year => `/?category=${encodeURIComponent(year)}`)}
        `;

        desktop.innerHTML = html;
        mobile.innerHTML = html;
    }

    window.AuthContext = {
        async logout() {
            await fetch("/auth/logout", {method: "POST"});
            window.location.href = "/";
        },
        async init() {
            try {
                const res = await fetch("/users/me");
                if (res.ok) {
                    document.getElementById('guestLinks').classList.add('hidden');
                    document.getElementById('authLinks').classList.remove('hidden');
                }
            } catch {
            }
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        syncHeaderHeight();
        loadCategories();
        window.AuthContext.init();
    });
</script>

{% block scripts %}{% endblock %}

</body>
</html>
