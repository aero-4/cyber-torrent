<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Войти</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        body {
            background-color: #000000;
            font-family: 'Space Mono', monospace;
            color: #3b82f6; /* Tailwind blue-500 */
        }

        /* Жесткий стиль для инпутов (убираем дефолтные стили автозаполнения браузера) */
        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            transition: background-color 0s 600000s, color 0s 600000s;
            -webkit-text-fill-color: #60a5fa;
            -webkit-box-shadow: 0 0 0px 1000px #000 inset;
            border: 4px solid #2563eb !important;
        }

        /* Убираем стрелочки у number input, если понадобятся */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">


<div id="systemPopup" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
    <div class="alien-popup border-4 border-blue-600 bg-black p-8 text-center min-w-[320px] shadow-[0_0_40px_rgba(37,99,235,0.5)]">
        <div id="popupMessage" class="text-2xl font-bold uppercase tracking-widest mb-6">TEXT</div>
        <button onclick="closePopup()" class="border-2 border-blue-600 bg-blue-600/20 px-8 py-3 text-xl font-bold uppercase hover:bg-blue-600 hover:text-black transition-colors w-full">
            ОК
        </button>
    </div>
</div>

<div class="w-full max-w-2xl border-4 border-blue-600 bg-black p-6 sm:p-10 shadow-[8px_8px_0px_#2563eb]">
    <div class="mb-8 border-b-4 border-blue-600 pb-4">
        <h1 class="text-4xl sm:text-5xl font-bold tracking-tighter uppercase text-white">ВОЙТИ</h1>
    </div>

    <div id="globalMessage" class="mb-6 text-center text-xl font-bold uppercase tracking-widest"></div>

    <div id="loginView">
        <form id="loginForm" class="space-y-6">
            <input type="hidden" id="token_key" value="885fed06dbfd6cd115cb18f3a7f30ccc1c218602"/>

            <div>
                <label for="email" class="mb-2 block text-xl sm:text-2xl font-bold uppercase">ЕМЕЙЛ</label>
                <input
                        type="email"
                        id="email"
                        required
                        class="w-full border-4 border-blue-600 bg-black px-6 py-5 text-xl sm:text-2xl text-blue-400 placeholder:text-blue-900 outline-none focus:bg-blue-950 transition-colors"
                        placeholder="USER@EMAIL.COM"
                />
            </div>

            <div>
                <label for="password" class="mb-2 block text-xl sm:text-2xl font-bold uppercase">ПАРОЛЬ</label>
                <input
                        type="password"
                        id="password"
                        required
                        class="w-full border-4 border-blue-600 bg-black px-6 py-5 text-xl sm:text-2xl text-blue-400 placeholder:text-blue-900 outline-none focus:bg-blue-950 transition-colors"
                        placeholder="••••••••"
                />
            </div>

            <div class="items-center justify-center my-auto w-full flex flex-col mt-8 text-center border-t-4 border-blue-900 pt-6">
                <div class="items-center flex flex-col gap-3">
                    <div class="flex flex-row gap-3">

                        <a href="/api/v1/auth/oauth2/google/url">
                            <img src="/api/v1/static/icons/google.png" width="48" alt="google">
                        </a>

                        <a href="/api/v1/auth/oauth2/yandex/url">
                            <img src="/api/v1/static/icons/yandex.png" width="48" alt="yandex" class="rounded-full">
                        </a>
                    </div>

                    <a href="/register" class="text-xl uppercase hover:underline decoration-4 underline-offset-8">
                        У МЕНЯ НЕТ АККАУНТА
                    </a>
                </div>
            </div>


            <button
                    type="submit"
                    class="mt-8 w-full border-4 border-blue-600 bg-blue-600 py-6 text-2xl sm:text-3xl font-bold text-black uppercase tracking-widest hover:bg-black hover:text-blue-600 transition-all shadow-[0_0_20px_rgba(37,99,235,0.4)]">
                ВОЙТИ
            </button>
        </form>
    </div>

    <div id="emailConfirmView" class="hidden">
        <div class="space-y-6">
            <div class="mb-2 text-2xl font-bold uppercase text-white text-center">ПОДТВЕРДИТЕ ЕМЕЙЛ</div>
            <div id="emailConfirmSubtitle" class="mb-6 text-center text-blue-400 font-bold uppercase tracking-widest"></div>

            <div id="emailConfirmOtpGroup" class="mb-4 flex gap-2 sm:gap-4 justify-center"></div>

            <div id="timerDisplay" class="mb-6 text-center text-3xl font-bold text-white tracking-widest">05:00</div>

            <button
                    id="confirmEmailBtn"
                    type="button"
                    class="w-full border-4 border-blue-600 bg-white py-6 text-2xl sm:text-3xl font-bold text-black uppercase tracking-widest hover:bg-blue-600 transition-all">
                ПОДТВЕРДИТЬ
            </button>

            <button
                    id="resendEmailCodeBtn"
                    type="button"
                    class="hidden w-full border-4 border-blue-600 bg-black py-4 text-xl font-bold text-blue-600 uppercase tracking-widest hover:bg-blue-900 transition-all">
                ОТПРАВИТЬ НОВЫЙ КОД
            </button>

            <button
                    id="backFromEmailConfirmBtn"
                    type="button"
                    class="w-full border-4 border-blue-900 bg-black py-4 text-xl font-bold text-blue-900 uppercase tracking-widest hover:border-blue-600 hover:text-blue-600 transition-all">
                НАЗАД
            </button>
        </div>
    </div>

    <div id="otpView" class="hidden">
        <div class="space-y-6">
            <div class="mb-6 text-2xl font-bold uppercase text-white text-center">ВВЕДИТЕ КОД ПОДТВЕРЖДЕНИЯ</div>

            <div id="otpInputGroup" class="mb-8 flex gap-2 sm:gap-4 justify-center"></div>

            <button
                    id="submitOtpBtn"
                    type="button"
                    class="w-full border-4 border-blue-600 bg-white py-6 text-2xl sm:text-3xl font-bold text-black uppercase tracking-widest hover:bg-blue-600 transition-all">
                ПОДТВЕРДИТЬ
            </button>

            <button
                    id="backBtn"
                    type="button"
                    class="w-full border-4 border-blue-900 bg-black py-4 text-xl font-bold text-blue-900 uppercase tracking-widest hover:border-blue-600 hover:text-blue-600 transition-all">
                ОТКЛОНИТЬ
            </button>

            <div id="otpMessage" class="mt-6 text-center text-xl font-bold uppercase tracking-widest"></div>
        </div>
    </div>

    <div id="otpSetupView" class="hidden">
        <div class="space-y-6">
            <div class="mb-6 text-2xl font-bold uppercase text-white border-b-4 border-blue-900 pb-4">СИНХРОНИЗУЙТЕ ДЕВАЙСЫ</div>

            <div>
                <label for="setupEmail" class="mb-2 block text-xl font-bold uppercase">ВАШ ЕМЕЙЛ</label>
                <input
                        type="email"
                        id="setupEmail"
                        class="w-full border-4 border-blue-600 bg-black px-6 py-4 text-xl text-blue-400 placeholder:text-blue-900 outline-none focus:bg-blue-950 transition-colors"
                        placeholder="USER@NODE.SYS"
                />
            </div>

            <button
                    id="loadQrBtn"
                    type="button"
                    class="w-full border-4 border-blue-600 bg-blue-600 py-4 text-xl font-bold text-black uppercase tracking-widest hover:bg-black hover:text-blue-600 transition-all">
                QR - КОД
            </button>

            <div id="qrBlock" class="mt-8 hidden">
                <div class="mx-auto flex h-64 w-64 items-center justify-center border-4 border-blue-600 bg-white p-4 shadow-[0_0_30px_rgba(37,99,235,0.3)]">
                    <img id="qrImage" alt="QR MATRIX" class="h-full w-full object-contain mix-blend-multiply"/>
                </div>
            </div>

            <div class="mt-10 mb-4 text-xl font-bold uppercase text-white text-center">ВВЕДИТЕ КОД</div>
            <div id="setupOtpInputGroup" class="mb-8 flex gap-2 sm:gap-4 justify-center"></div>

            <button
                    id="confirmAddOtpBtn"
                    type="button"
                    class="w-full border-4 border-blue-600 bg-white py-6 text-2xl sm:text-3xl font-bold text-black uppercase tracking-widest hover:bg-blue-600 transition-all">
                ПОДТВЕРДИТЬ
            </button>

            <button
                    id="setupBackBtn"
                    type="button"
                    class="w-full border-4 border-blue-900 bg-black py-4 text-xl font-bold text-blue-900 uppercase tracking-widest hover:border-blue-600 hover:text-blue-600 transition-all">
                НАЗАД
            </button>

            <div id="addOtpMessage" class="mt-6 text-center text-xl font-bold uppercase tracking-widest"></div>
        </div>
    </div>
</div>

<script>
    const tokenKey = document.getElementById('token_key').value;

    const loginView = document.getElementById('loginView');
    const otpView = document.getElementById('otpView');
    const otpSetupView = document.getElementById('otpSetupView');
    const emailConfirmView = document.getElementById('emailConfirmView');

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    const setupEmailInput = document.getElementById('setupEmail');

    const globalMessage = document.getElementById('globalMessage');
    const otpMessage = document.getElementById('otpMessage');
    const addOtpMessage = document.getElementById('addOtpMessage');

    const otpInputGroup = document.getElementById('otpInputGroup');
    const setupOtpInputGroup = document.getElementById('setupOtpInputGroup');
    const emailConfirmOtpGroup = document.getElementById('emailConfirmOtpGroup');

    const submitOtpBtn = document.getElementById('submitOtpBtn');
    const backBtn = document.getElementById('backBtn');

    // Кнопки и элементы подтверждения Email
    const confirmEmailBtn = document.getElementById('confirmEmailBtn');
    const resendEmailCodeBtn = document.getElementById('resendEmailCodeBtn');
    const backFromEmailConfirmBtn = document.getElementById('backFromEmailConfirmBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const emailConfirmSubtitle = document.getElementById('emailConfirmSubtitle');

    const loadQrBtn = document.getElementById('loadQrBtn');
    const qrBlock = document.getElementById('qrBlock');
    const qrImage = document.getElementById('qrImage');
    const confirmAddOtpBtn = document.getElementById('confirmAddOtpBtn');
    const setupBackBtn = document.getElementById('setupBackBtn');
    const systemPopup = document.getElementById('systemPopup');
    const popupMessage = document.getElementById('popupMessage');

    let pendingEmail = '';
    let pendingPassword = '';
    let currentQrObjectUrl = null;
    let pendingOtpSetup = false;
    let emailTimerInterval = null;

    function setGlobalMessage(text = '', isError = false) {
        globalMessage.textContent = text;
        globalMessage.className = `mb-6 text-center text-xl font-bold uppercase tracking-widest ${isError ? 'text-red-500' : 'text-blue-400'}`;
    }

    function setOtpMessage(text = '', isError = false) {
        otpMessage.textContent = text;
        otpMessage.className = `mt-6 text-center text-xl font-bold uppercase tracking-widest ${isError ? 'text-red-500' : 'text-blue-400'}`;
    }

    function setAddOtpMessage(text = '', isError = false) {
        addOtpMessage.textContent = text;
        addOtpMessage.className = `mt-6 text-center text-xl font-bold uppercase tracking-widest ${isError ? 'text-red-500' : 'text-blue-400'}`;
    }

    function createOtpInputs(container) {
        container.innerHTML = '';
        for (let i = 0; i < 6; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.maxLength = 1;
            input.inputMode = 'numeric';
            input.autocomplete = 'one-time-code';
            input.className = 'h-16 w-12 sm:h-20 sm:w-16 border-4 border-blue-600 bg-black text-center text-3xl sm:text-4xl font-bold text-white outline-none focus:bg-blue-950 transition-colors focus:border-white focus:text-white';

            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value && !/^\d$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                if (value && i < 5) {
                    container.children[i + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) {
                    container.children[i - 1].focus();
                }
            });

            container.appendChild(input);
        }
    }

    function showPopup(msg, isError = false) {
        popupMessage.textContent = msg;
        popupMessage.className = `text-2xl font-bold uppercase tracking-widest mb-6 ${isError ? 'text-red-500' : 'text-blue-400'}`;
        systemPopup.classList.remove('hidden');
    }

    function closePopup() {
        systemPopup.classList.add('hidden');
    }

    function clearInputs(container) {
        for (let i = 0; i < 6; i++) {
            if (container.children[i]) container.children[i].value = '';
        }
    }

    function getOtpCode(container) {
        let code = '';
        for (let i = 0; i < 6; i++) {
            const val = container.children[i]?.value || '';
            if (!val) return null;
            code += val;
        }
        return code;
    }

    function hideQr() {
        qrBlock.classList.add('hidden');
        if (currentQrObjectUrl) {
            URL.revokeObjectURL(currentQrObjectUrl);
            currentQrObjectUrl = null;
        }
        qrImage.removeAttribute('src');
    }

    function showLoginForm() {
        clearInterval(emailTimerInterval);
        otpView.classList.add('hidden');
        otpSetupView.classList.add('hidden');
        emailConfirmView.classList.add('hidden');
        loginView.classList.remove('hidden');
        pendingOtpSetup = false;
        setOtpMessage('');
        setAddOtpMessage('');
        clearInputs(otpInputGroup);
        clearInputs(setupOtpInputGroup);
        clearInputs(emailConfirmOtpGroup);
        hideQr();
    }

    function showOtpForm() {
        loginView.classList.add('hidden');
        otpSetupView.classList.add('hidden');
        emailConfirmView.classList.add('hidden');
        otpView.classList.remove('hidden');
        setOtpMessage('');
        clearInputs(otpInputGroup);
        otpInputGroup.children[0]?.focus();
    }

    function showOtpSetupForm(emailForSetup) {
        loginView.classList.add('hidden');
        otpView.classList.add('hidden');
        emailConfirmView.classList.add('hidden');
        otpSetupView.classList.remove('hidden');
        setAddOtpMessage('');
        clearInputs(setupOtpInputGroup);
        setupEmailInput.value = emailForSetup || '';
        if (emailForSetup) {
            loadQr(emailForSetup);
        } else {
            hideQr();
        }
        setupOtpInputGroup.children[0]?.focus();
    }

    function startEmailTimer() {
        clearInterval(emailTimerInterval);
        resendEmailCodeBtn.classList.add('hidden');
        let timeLeft = 300; // 5 минут = 300 секунд

        const updateTimerDisplay = () => {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
        };

        updateTimerDisplay();

        emailTimerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                clearInterval(emailTimerInterval);
                resendEmailCodeBtn.classList.remove('hidden');
            }
        }, 1000);
    }

    function showEmailConfirmForm(email) {
        loginView.classList.add('hidden');
        otpView.classList.add('hidden');
        otpSetupView.classList.add('hidden');
        emailConfirmView.classList.remove('hidden');

        emailConfirmSubtitle.textContent = `КОД ОТПРАВЛЕН НА ${email}`;
        clearInputs(emailConfirmOtpGroup);
        emailConfirmOtpGroup.children[0]?.focus();

        startEmailTimer();
    }

    async function safeJson(response) {
        const text = await response.text();
        try {
            return JSON.parse(text);
        } catch {
            return {message: text || 'Unexpected server response'};
        }
    }

    async function postForm(url, data) {
        const response = await fetch(url, {
            method: 'POST',
            body: JSON.stringify(data),
            headers: {"Content-Type": "application/json"}
        });

        return {response, data: await safeJson(response)};
    }

    async function loadQr(email) {
        if (!email) {
            hideQr();
            return;
        }

        const formData = new FormData();
        formData.append('email', email);

        const response = await fetch('/api/v1/auth/otp/qr', {
            method: 'POST',
            body: formData,
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const blob = await response.blob();
        if (currentQrObjectUrl) {
            URL.revokeObjectURL(currentQrObjectUrl);
        }

        currentQrObjectUrl = URL.createObjectURL(blob);
        qrImage.src = currentQrObjectUrl;
        qrBlock.classList.remove('hidden');
    }

    async function performLogin(email, password, otpCode = null) {
        const payload = {
            token_key: tokenKey,
            email,
            password,
        };

        if (otpCode) {
            payload.otp_code = otpCode;
        }

        const {data} = await postForm('/api/v1/auth/login', payload);

        if (data.status === 422) {
            setGlobalMessage(data.detail[0].message || data.detail, true);
        }

        // --- ЛОГИКА 1: Проверка на запрос подтверждения почты ---
        const errorMsg = data.error.message;

        if (errorMsg === "Email code required") {
            pendingEmail = email;
            pendingPassword = password;
            showEmailConfirmForm(email);
            return;
        }

        if (errorMsg) {
            setGlobalMessage(errorMsg, true);
        }

        if (data.error?.message === 'OTP code required') {
            pendingEmail = email;
            pendingPassword = password;
            createOtpInputs(otpInputGroup);
            showOtpForm();
            return;
        }

        if (data.message === 'User sign in') {
            setGlobalMessage('SUCCESS. REDIRECTING...', false);
            setTimeout(() => {
                window.location.href = '/';
            }, 900);
            return;
        }

        if (data.message) {
            setGlobalMessage(data.message, true);
        }
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            setGlobalMessage('MISSING_CREDENTIALS', true);
            return;
        }

        try {
            await performLogin(email, password, null);
        } catch {
            setGlobalMessage('NETWORK_ERROR', true);
        }
    });

    // --- ЛОГИКА 2 и 3: Обработчики для подтверждения почты ---
    confirmEmailBtn.addEventListener('click', async () => {
        const code = getOtpCode(emailConfirmOtpGroup);
        if (!code) {
            showPopup('ВВЕДИТЕ 6 ЦИФР КОДА', true);
            return;
        }

        try {
            const response = await fetch(`/api/v1/email/2fa/code/${code}`, {
                method: 'GET'
            });
            const data = await safeJson(response);

            if (data.message === "Email verified") {
                // Если все ок - логиним пользователя повторно или редиректим
                clearInterval(emailTimerInterval);
                setGlobalMessage('ПОЧТА ПОДТВЕРЖДЕНА. ВХОД...', false);
                showLoginForm();
                // Автоматически производим логин после успешного подтверждения:
                await performLogin(pendingEmail, pendingPassword, null);
            } else {
                showPopup(data.error?.message || data.message || 'ОШИБКА ПОДТВЕРЖДЕНИЯ', true);
            }
        } catch (err) {
            showPopup('NETWORK ERROR', true);
        }
    });

    resendEmailCodeBtn.addEventListener('click', async () => {
        if (pendingEmail && pendingPassword) {
            await performLogin(pendingEmail, pendingPassword, null);
        }
    });

    backFromEmailConfirmBtn.addEventListener('click', () => {
        pendingEmail = '';
        pendingPassword = '';
        showLoginForm();
    });


    // Обработчики OTP формы
    submitOtpBtn.addEventListener('click', async () => {
        const otpCode = getOtpCode(otpInputGroup);

        if (!otpCode) {
            setOtpMessage('INPUT_6_DIGITS', true);
            return;
        }

        if (!pendingEmail || !pendingPassword) {
            setOtpMessage('SESSION_EXPIRED. RE-LOGIN.', true);
            return;
        }

        try {
            const {data} = await postForm('/api/v1/auth/login', {
                token_key: tokenKey,
                email: pendingEmail,
                password: pendingPassword,
                otp_code: otpCode,
            });

            if (data.message === 'User sign up') {
                setOtpMessage('');
                setGlobalMessage('SUCCESS. REDIRECTING...', false);
                setTimeout(() => {
                    window.location.href = '/';
                }, 900);
                return;
            }

            if (data.error?.message === 'OTP code is invalid') {
                setOtpMessage('INVALID_OTP_CODE', true);
                return;
            }

            if (data.error?.message === 'Not input OTP code') {
                setOtpMessage('MISSING_OTP_CODE', true);
                return;
            }

            if (data.message === 'OTP Code required') {
                return;
            }

            if (data.message) {
                setOtpMessage(data.message, true);
            }
        } catch {
            setOtpMessage('NETWORK_ERROR', true);
        }
    });

    backBtn.addEventListener('click', () => {
        pendingEmail = '';
        pendingPassword = '';
        showLoginForm();
    });

    confirmAddOtpBtn.addEventListener('click', async () => {
        const email = setupEmailInput.value.trim();
        const code = getOtpCode(setupOtpInputGroup);

        if (!email) {
            setAddOtpMessage('MISSING_EMAIL', true);
            return;
        }

        if (!code) {
            setAddOtpMessage('INPUT_6_DIGITS', true);
            return;
        }

        try {
            const {data} = await postForm('/api/v1/auth/otp/confirm', {
                email,
                otp_code: code,
            });

            if (data.message === 'Otp verify confirm') {
                setAddOtpMessage('SYNC_SUCCESS', false);
                hideQr();

                if (pendingOtpSetup && pendingEmail && pendingPassword) {
                    pendingOtpSetup = false;
                    await performLogin(pendingEmail, pendingPassword, null);
                } else {
                    setTimeout(() => {
                        showLoginForm();
                    }, 1200);
                }
                return;
            }

            if (data.error?.message === 'OTP code is invalid') {
                setAddOtpMessage('INVALID_OTP_CODE', true);
                return;
            }

            if (data.error?.message === 'Not input OTP code') {
                setAddOtpMessage('MISSING_OTP_CODE', true);
                return;
            }

            if (data.message) {
                setAddOtpMessage(data.message, true);
            }
        } catch {
            setAddOtpMessage('NETWORK_ERROR', true);
        }
    });

    setupBackBtn.addEventListener('click', () => {
        hideQr();
        pendingOtpSetup = false;
        showLoginForm();
    });

    loadQrBtn.addEventListener('click', async () => {
        const email = setupEmailInput.value.trim();
        if (!email) {
            setAddOtpMessage('MISSING_EMAIL', true);
            return;
        }

        try {
            await loadQr(email);
        } catch {
            setAddOtpMessage('MATRIX_LOAD_FAILED', true);
        }
    });

    setupEmailInput.addEventListener('input', async () => {
        const email = setupEmailInput.value.trim();
        if (!email) {
            hideQr();
            return;
        }

        try {
            await loadQr(email);
        } catch {
            setAddOtpMessage('MATRIX_LOAD_FAILED', true);
        }
    });


    createOtpInputs(otpInputGroup);
    createOtpInputs(setupOtpInputGroup);
    createOtpInputs(emailConfirmOtpGroup);
    showLoginForm();
</script>
</body>
</html>
