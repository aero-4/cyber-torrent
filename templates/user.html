<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>SYS.LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        body {
            background-color: #000000;
            font-family: 'Space Mono', monospace;
            color: #3b82f6; /* Tailwind blue-500 */
        }

        /* Жесткий стиль для инпутов (убираем дефолтные стили автозаполнения браузера) */
        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            transition: background-color 0s 600000s, color 0s 600000s;
            -webkit-text-fill-color: #60a5fa;
            -webkit-box-shadow: 0 0 0px 1000px #000 inset;
            border: 4px solid #2563eb !important;
        }

        /* Убираем стрелочки у number input, если понадобятся */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">


<div class="w-full max-w-2xl border-4 border-blue-600 bg-black p-6 sm:p-10 shadow-[8px_8px_0px_#2563eb]">
    <div class="mb-8 border-b-4 border-blue-600 pb-4">
        <h1 class="text-4xl sm:text-5xl font-bold tracking-tighter uppercase text-white">ПРОФИЛЬ</h1>
    </div>

    <div id="user" class="w-full mb-6 text-center text-xl font-bold uppercase tracking-widest">

    </div>

</div>

<script>
    const user = document.getElementById('user');

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch(`/users/me`,
                {method: "GET"}
            );
            const data = await response.json();

            user.innerHTML = `
                <img class="rounded-full mx-auto justify-center items-center" src="${data.avatar_image}"/>

                <h3>EMAIL: ${data.email}</h3>

            `;
        } catch (error) {
            user.innerHTML = "<p>Error loading content.</p>";
        }
    });

</script>
</body>
</html>
