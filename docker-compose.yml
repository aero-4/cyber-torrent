services:
  app:
    build:
      context: .
    env_file: .env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: bash -c "alembic upgrade head && uvicorn src.core.app:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    networks: [ backend_net ]

  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks: [ backend_net ]

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks: [ backend_net ]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [ backend_net ]

  taskiq_worker:
    build:
      context: .
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: taskiq worker src.core.taskiq_app:broker --fs-discover --tasks-pattern **/tasks/*.py
    restart: unless-stopped
    networks: [ backend_net ]

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    env_file: .env
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
      - nginx_certs:/etc/nginx/certs
    restart: unless-stopped
    networks: [ backend_net ]

  certbot:
    build:
      context: .
      dockerfile: infra/certbot/Dockerfile
    env_file: .env
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
      - nginx_certs:/nginx-certs
    restart: unless-stopped
    networks: [ backend_net ]

networks:
  backend_net:
    driver: bridge

volumes:
  rabbitmq-data:
  redis-data:
  postgres_data:
  certbot_www:
  certbot_etc:
  nginx_certs:
