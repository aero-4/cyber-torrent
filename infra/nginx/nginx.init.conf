worker_processes auto;
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name cyber-torrent.top www.cyber-torrent.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name cyber-torrent.top www.cyber-torrent.top;

        ssl_certificate /etc/letsencrypt/live/cyber-torrent.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cyber-torrent.top/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;

            proxy_pass http://app:8000;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
