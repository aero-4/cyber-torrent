[project]
name = "jwtauth"
version = "0.2.0"
description = "jwt auth for all services"
authors = [
    {name = "zangetsu",email = "dimongames6@gmail.com"}
]
license = "mitmap"
requires-python = ">=3.12"
dependencies = [
    "pycryptodome (>=3.23.0,<4.0.0)",
    "fastapi (>=0.135.3,<0.136.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "uvicorn (>=0.43.0,<0.44.0)",
    "sqladmin[full] (>=0.24.0,<0.25.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "aiosmtplib (>=5.1.0,<6.0.0)",
    "multipart (>=1.3.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
