[project]
name = "cybertorrent"
version = "0.2.0"
description = "jwt auth for all services"
authors = [
    {name = "zangetsu",email = "dimongames6@gmail.com"}
]
license = "mitmap"
requires-python = ">=3.10,<4"
package-mode = false
dependencies = [
    "pycryptodome (>=3.23.0,<4.0.0)",
    "fastapi (>=0.135.3,<0.136.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "uvicorn (>=0.43.0,<0.44.0)",
    "sqladmin[full] (>=0.24.0,<0.25.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "aiosmtplib (>=5.1.0,<6.0.0)",
    "multipart (>=1.3.1,<2.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)",
    "torrent-scrapers (>=0.0.2,<0.0.3)",
    "piratebayapi (>=1.0.1,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "libtorrent (>=2.0.11,<3.0.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
    "googletrans (>=4.0.2,<5.0.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
    "taskiq-redis (>=1.2.2,<2.0.0)",
    "taskiq-aio-pika (>=0.6.0,<0.7.0)",
    "taskiq (>=0.12.1,<0.13.0)",
    "starlette-admin (>=0.16.0,<0.17.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyotp (>=2.9.0,<3.0.0)",
    "qrcode (>=8.2,<9.0)",
    "pydantic[email] (>=2.13.2,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "alembic (>=1.18.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
